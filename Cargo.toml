[package]
name = "plaquette"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A framework for Monte Carlo simulation of lattice models."

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
rand = "0.10.2"
rand_pcg = "0.10.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
wgpu = "26.0.1"
