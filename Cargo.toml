[package]
name = "plaquette"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "A framework for Monte Carlo simulation of lattice models."
repository = "https://github.com/swvasquez/plaquette"
readme = "README.md"
keywords = ["monte-carlo", "lattice", "physics", "ising", "gauge-theory"]
categories = ["science", "simulation"]

# Applied to every target in the package, so tests and examples are held to the
# same rules as the library. `unsafe_code` is denied rather than forbidden, so an
# eventual need — FFI, or unchecked indexing in a hot loop — is a reviewable
# exception at one site instead of dropping the rule for the whole crate.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
rand = "0.10.2"
rand_pcg = "0.10.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
wgpu = "26.0.1"

# Examples are grouped by model, one directory per model, so that each run
# config sits beside the example that reads it — `run.toml` and `gpu.toml` say
# nothing about which model they configure, and the directory does.
#
# Cargo only discovers `examples/*.rs` and `examples/*/main.rs` on its own, and
# the Ising directory holds three examples rather than one, so each is named
# here. The example names are unchanged: `cargo run --example ising` still works.

[[example]]
name = "ising"
path = "examples/ising/ising.rs"

[[example]]
name = "checkerboard"
path = "examples/ising/checkerboard.rs"

[[example]]
name = "bench"
path = "examples/ising/bench.rs"

[[example]]
name = "potts"
path = "examples/potts/potts.rs"

[[example]]
name = "gauge"
path = "examples/gauge/gauge.rs"

[[example]]
name = "gauge_bench"
path = "examples/gauge/bench.rs"
