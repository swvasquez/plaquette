name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, so the token gets read-only scope.
permissions:
  contents: read

# A new push to the same branch makes an in-flight run obsolete; cancel it
# rather than paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # A wedged GPU test would otherwise sit until the six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml, so the version and components are declared in
      # one place and CI cannot drift from a local checkout. Caches the
      # dependency build itself, which matters because wgpu is a long compile.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # Mesa's lavapipe is a software Vulkan implementation, so the GPU
      # checkerboard backend runs on a runner with no graphics hardware. The
      # loader is named explicitly rather than relied on as a transitive
      # dependency of the driver package.
      - name: Install software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - run: cargo fmt --all --check

      - run: cargo clippy --locked --all-targets -- -D warnings

      # Mesa can expose both Vulkan (lavapipe) and GL (llvmpipe), so the backend
      # is pinned rather than left to adapter order. `PLAQUETTE_REQUIRE_GPU` makes
      # a missing wgpu adapter fail the run — without it a driver that failed to
      # load would leave the GPU tests skipping silently and the job green.
      - run: cargo test --locked
        env:
          WGPU_BACKEND: vulkan
          PLAQUETTE_REQUIRE_GPU: 1

      # Fails on broken intra-doc links, which are invisible until docs.rs
      # renders them.
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
