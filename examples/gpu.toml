# GPU checkerboard run:
#
#     cargo run --release --example ising -- examples/gpu.toml
#
# Same interface as the CPU runs — only `updater` changes. A larger lattice than
# the CPU examples, since the GPU pays off at scale (crossover is near L = 64).
# Needs a GPU adapter; run with the sandbox disabled.

shape = [128, 128]
j = 1.0
h = 0.0
beta = 0.44

updater = "gpu_checkerboard"
thermalize = 500
sweeps_between = 5
n_samples = 1000

seed = 20260718
start = "hot"

description = "128x128 at T_c, GPU checkerboard"
