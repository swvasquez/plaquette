# A single Z2 gauge run. Edit and re-run — no recompile needed:
#
#     cargo run --release --example gauge -- examples/gauge/gauge.toml
#
# Note that this comment does not survive a round-trip: serde carries data, not
# formatting. Anything that must travel with the run's provenance record goes in
# the `description` field below.
#
# Unknown keys are rejected, so a typo here fails at load rather than being
# silently ignored. That is also what stops an Ising config being run as a gauge
# theory: `h` is not a field here, so an Ising file is refused on that key.

# Physics. There is no `h` to go with `j`: a term reading individual links would
# destroy the local symmetry that makes this a gauge theory.
shape = [8, 8, 8]  # lattice extents; length must match `const D` in examples/gauge/gauge.rs
j = 1.0            # plaquette coupling
beta = 0.75        # inverse temperature; the transition sits at beta_c ~ 0.7613,
                   # so this is the confined phase just below it — and on a box
                   # this small the specific heat peaks a little lower still.
                   # Expect a long tau_int here for the usual reason: a chain
                   # near a transition decorrelates slowly.

# Driver controls. A run is named by three orthogonal fields: `updater` picks
# the rule ("metropolis" or "heat_bath" here — "swendsen_wang" is rejected,
# since a plaquette energy has no bond graph to build clusters on), `schedule`
# picks the walk ("random" when omitted, or "checkerboard", which on this
# model colors links by direction and base-site parity), and `backend` picks
# where it runs ("cpu" when omitted, or "gpu", which needs the checkerboard
# schedule and even extents).
updater = "metropolis"  # optional, defaults to "metropolis"
thermalize = 500        # warmup sweeps, discarded
sweeps_between = 5      # decorrelation sweeps between samples
n_samples = 500         # samples to record

# Reproducibility: this seed alone replays the whole run, start config included.
seed = 20260728

# Start configuration: "cold" (every link aligned) or "hot" (random).
start = "hot"

# What to measure is NOT specified here: a run produces configurations, and any
# observable can be computed from them afterwards. Which Wilson rectangles to
# report, and whether to read a Polyakov loop at all, live in the example source.

description = "8x8x8 just below the deconfinement coupling"
